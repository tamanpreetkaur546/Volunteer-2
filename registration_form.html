<html>
<head>
    <title>VolunteerGateway login</title>
    <link rel="stylesheet" href="formstyle.css">
</head>
<body>
    <div class="login">
        <h2 align="center">Join VolunteerGateway</h2>
        <form>
            <label>Name: </label>
            <input type="text" name="Name" placeholder="Enter Your Name"><br><br>
            <label>Email: </label>
            <input type="Text" name="Email" placeholder="Enter Your Email"><br><br> 
            <label>Date of birth:</label>
            <input type="date" name="Date of birth"><br><br>
            <label>Address: </label>
            <input type="text" name="Name"  placeholder="Enter Your Address" ><br><br>

            <label>Gender: </label>
            <input type="radio" name="Gender" value="Male">Male 
            <input type="radio" name="Gender" value="Female">Female<br><br>
            <label>Category : </label>
            <select>
                <option>blood donation</option>
                <option>digital literacy drive </option>
                <option>food distribution drive</option>
                <option>animal welfare</option>
                <option>Cleanliness drive</option>
                <option>senior citizen care</option>
            </select><br><br>
            <label></label>
            
            <button onclick="alert('Registered successfully')">Register</button><br><br>
        </form>
        
    </div>
</body>

</html>
