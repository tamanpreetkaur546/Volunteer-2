<html>
<head>
    <title>Create event</title>
    <link rel="stylesheet" href="formstyle.css">
</head>
<body>
    <div class="login">
        <h2 align="center">Create Event</h2>
        <form>
            <label>Name of event: </label>
            <input type="text" name="Name of event" placeholder="Enter Event name"><br><br>
             
            <label>Date of Event:</label>
            <input type="date" name="Date of event"><br><br>
            <label>Address: </label>
            <input type="text" name="Address"  placeholder="Enter Event Address" ><br><br>

            
            <label>Category : </label>
            <select>
                <option>blood donation</option>
                <option>digital literacy drive </option>
                <option>food distribution drive</option>
                <option>animal welfare</option>
                <option>Cleanliness drive</option>
                <option>senior citizen care</option>
                <option>other</option>
            </select><br><br>
            <label></label>
            <label>Event discription:</label>
            <textarea name="event discription" rows="10" cols="30"></textarea><br><br>
            
            <button onclick="alert('Event created successfully')">Create</button><br><br>
        </form>
        
    </div>
</body>

</html>
